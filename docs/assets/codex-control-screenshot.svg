<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Control session browser screenshot</title>
  <desc id="desc">A dark Codex Control interface showing a session list, selected session timeline, transcript cards, and prompt composer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101316"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2126"/>
      <stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="34" y="34" width="1372" height="832" rx="18" fill="#111417" stroke="#2d333a" filter="url(#shadow)"/>
  <rect x="34" y="34" width="1372" height="58" rx="18" fill="#20242a"/>
  <circle cx="70" cy="63" r="8" fill="#ff6b6b"/>
  <circle cx="96" cy="63" r="8" fill="#ffd166"/>
  <circle cx="122" cy="63" r="8" fill="#6bcb77"/>
  <text x="160" y="70" fill="#f4f2ea" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Codex Control</text>
  <text x="1245" y="69" fill="#9da4ad" font-family="Segoe UI, Arial, sans-serif" font-size="14">localhost:4567</text>

  <rect x="54" y="112" width="400" height="734" rx="16" fill="#121519" stroke="#2a3036"/>
  <text x="82" y="153" fill="#e8e5dd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Sessions</text>
  <rect x="374" y="127" width="48" height="42" rx="14" fill="#1f242a" stroke="#303740"/>
  <text x="392" y="154" fill="#e8e5dd" font-family="Segoe UI, Arial, sans-serif" font-size="28">+</text>
  <rect x="82" y="190" width="340" height="42" rx="12" fill="#191d22" stroke="#343b44"/>
  <text x="104" y="216" fill="#e8e5dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">open-source/demo-repo (8)</text>
  <rect x="82" y="250" width="340" height="42" rx="12" fill="#111418" stroke="#2b3138"/>
  <text x="104" y="276" fill="#858c95" font-family="Segoe UI, Arial, sans-serif" font-size="16">search sessions</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">
    <rect x="70" y="314" width="368" height="58" rx="12" fill="#1d231d" stroke="#3e5c3f"/>
    <text x="94" y="350" fill="#f0eee8">Improve onboarding flow</text>
    <rect x="323" y="326" width="78" height="34" rx="17" fill="#172618" stroke="#5b875d"/>
    <text x="344" y="349" fill="#95d48d" font-size="15">active</text>
    <text x="94" y="414" fill="#e8e5dd">Polish transcript rendering</text>
    <text x="326" y="414" fill="#aeb4bc" font-size="15">23m ago</text>
    <text x="94" y="472" fill="#e8e5dd">Add repository setup</text>
    <text x="326" y="472" fill="#aeb4bc" font-size="15">1h ago</text>
    <text x="94" y="530" fill="#e8e5dd">Review auth defaults</text>
    <text x="326" y="530" fill="#aeb4bc" font-size="15">2h ago</text>
    <text x="94" y="588" fill="#e8e5dd">Create worktree dialog</text>
    <text x="326" y="588" fill="#aeb4bc" font-size="15">4h ago</text>
  </g>
  <rect x="82" y="790" width="46" height="42" rx="13" fill="#1c2127" stroke="#303740"/>
  <circle cx="105" cy="811" r="8" fill="none" stroke="#cdd3da" stroke-width="2"/>
  <circle cx="105" cy="811" r="2" fill="#cdd3da"/>

  <rect x="474" y="112" width="912" height="734" rx="16" fill="#121519" stroke="#2a3036"/>
  <text x="510" y="156" fill="#f4f2ea" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">Improve onboarding flow</text>
  <rect x="1112" y="129" width="78" height="34" rx="17" fill="#172618" stroke="#5b875d"/>
  <text x="1135" y="151" fill="#95d48d" font-family="Segoe UI, Arial, sans-serif" font-size="15">active</text>
  <rect x="1204" y="129" width="116" height="34" rx="17" fill="#1a2219" stroke="#416447"/>
  <text x="1223" y="151" fill="#93d390" font-family="Segoe UI, Arial, sans-serif" font-size="15">gpt-5.5</text>
  <rect x="1330" y="129" width="42" height="34" rx="17" fill="#272116" stroke="#8c6b2f"/>
  <text x="1342" y="151" fill="#e8bd66" font-family="Segoe UI, Arial, sans-serif" font-size="15">high</text>

  <line x1="510" y1="186" x2="1350" y2="186" stroke="#2b3138"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="510" y="218" width="820" height="178" rx="14" fill="url(#panel)" stroke="#303740"/>
    <text x="534" y="252" fill="#aeb4bc" font-size="16" font-weight="700">Prompt</text>
    <text x="534" y="286" fill="#f0eee8" font-size="18">Add a concise first-run guide and make the setup states clearer.</text>
    <rect x="534" y="326" width="240" height="34" rx="10" fill="#111418" stroke="#2f363e"/>
    <text x="552" y="348" fill="#cdd3da" font-size="15">docs/onboarding.md</text>

    <rect x="510" y="420" width="820" height="214" rx="14" fill="url(#panel)" stroke="#303740"/>
    <text x="534" y="454" fill="#aeb4bc" font-size="16" font-weight="700">Response</text>
    <text x="534" y="490" fill="#f0eee8" font-size="18">Implemented a guided setup checklist and linked the relevant config files.</text>
    <text x="534" y="528" fill="#f0eee8" font-size="18">The README now separates trusted local use from exposed deployments.</text>
    <rect x="534" y="566" width="160" height="34" rx="10" fill="#111418" stroke="#2f363e"/>
    <text x="552" y="588" fill="#8fd18c" font-size="15">README.md</text>
    <rect x="710" y="566" width="180" height="34" rx="10" fill="#111418" stroke="#2f363e"/>
    <text x="728" y="588" fill="#8fd18c" font-size="15">.env.example</text>

    <rect x="510" y="658" width="820" height="64" rx="14" fill="#15191e" stroke="#303740" stroke-dasharray="4 4"/>
    <text x="534" y="697" fill="#aeb4bc" font-size="16">Intermediate activity collapsed</text>
  </g>

  <rect x="510" y="746" width="840" height="74" rx="16" fill="#111418" stroke="#303740"/>
  <text x="536" y="790" fill="#8f969f" font-family="Segoe UI, Arial, sans-serif" font-size="18">Send a follow-up to this session</text>
  <rect x="1044" y="762" width="118" height="42" rx="14" fill="#182018" stroke="#344f37"/>
  <text x="1071" y="789" fill="#e8e5dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">gpt-5.5</text>
  <rect x="1174" y="762" width="80" height="42" rx="14" fill="#181b20" stroke="#343b44"/>
  <text x="1198" y="789" fill="#e8e5dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">high</text>
  <rect x="1266" y="762" width="66" height="42" rx="14" fill="#2a2f35" stroke="#3c444d"/>
  <text x="1285" y="789" fill="#f4f2ea" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Send</text>
</svg>
