<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="layout" id="layout">
    <section class="panel list-panel" id="sidebar">
      <div class="sidebar-rail">
        <button id="expandSidebar" type="button" title="Show sessions">▶</button>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-actions">
          <button id="collapseSidebar" type="button" title="Hide sessions">◀</button>
          <strong>Sessions</strong>
          <button id="newSessionButton" class="sidebar-primary" type="button">New</button>
        </div>

        <form id="filters" class="filters">
          <div class="repo-row">
            <select name="repo" id="repoFilter" title="Git repository">
              <option value="">all repos</option>
              <option value="__add_repo__">+ Add repo...</option>
            </select>
          </div>

          <div class="search-row">
            <input name="q" id="searchInput" placeholder="search sessions">
            <button id="filterToggle" type="button" aria-expanded="false" aria-controls="filterDrawer">Filters</button>
          </div>

          <div id="filterDrawer" class="filter-drawer" hidden>
            <div class="drawer-head">
              <strong>Filters</strong>
              <button id="filterClose" type="button">Close</button>
            </div>
            <div class="drawer-grid">
              <input name="branch" placeholder="branch contains">
              <select name="source" title="Source">
                <option value="">all sources</option>
                <option value="vscode">vscode</option>
                <option value="cli">cli</option>
              </select>
              <label class="check"><input type="checkbox" name="groupBranch"> group by branch</label>
              <label class="check"><input type="checkbox" name="archived"> show archived</label>
            </div>
          </div>
        </form>
        <div id="sessionList" class="session-list"></div>
      </div>
    </section>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="Drag to resize sessions pane"><span></span></div>

    <section class="panel detail-panel">
      <div id="detail" class="empty">Pick a session.</div>
    </section>
  </main>

  <dialog id="newSessionDialog" class="modal">
    <form id="newSessionForm" class="modal-card" method="dialog">
      <div class="modal-head">
        <div>
          <strong>New session</strong>
          <p>Choose an existing worktree, or create one first.</p>
        </div>
        <button id="closeNewSession" type="button" title="Close">×</button>
      </div>

      <label>
        Repo
        <select id="newRepoSelect" name="repo"></select>
      </label>

      <label>
        Worktree
        <select id="newWorktreeSelect" name="cwd"></select>
      </label>
      <div id="newWorktreeHint" class="hint"></div>

      <label>
        First prompt <span class="muted">optional</span>
        <textarea name="prompt" rows="4" placeholder="Start this lane with..."></textarea>
      </label>

      <div class="modal-actions">
        <button id="createWorktreeButton" type="button">Create worktree…</button>
        <span></span>
        <button id="cancelNewSession" type="button">Cancel</button>
        <button type="submit">Start session</button>
      </div>
    </form>
  </dialog>

  <p id="status" class="sr-only" aria-live="polite">Connecting to Codex...</p>
  <script type="module" src="/app.js"></script>
</body>
</html>
